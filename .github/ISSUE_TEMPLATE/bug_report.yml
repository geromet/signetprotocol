name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: Commands, world (`signet:nexo`, `doom:E1M1`…), game or engine involved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: SDK version and protocol (for example 0.1.0-beta.1 / Signet/1).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server or client output. Do not paste game files.
      render: shell
