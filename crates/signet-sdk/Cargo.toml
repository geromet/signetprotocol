[package]
name = "signet-sdk"
description = "Signet Protocol SDK: the neutral Signet/1 protocol, shared rules, a predicting client and translator interfaces so any game can join the same world."
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["gamedev", "multiplayer", "interoperability", "netcode"]
categories = ["game-development", "network-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
